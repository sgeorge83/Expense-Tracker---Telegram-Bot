[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-telegram-bot"
version = "0.1.0"
description = "AI-powered voice-first expense tracker on Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-telegram-bot>=21.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "alembic>=1.13.0",
  "openai>=1.0.0",
  "python-multipart>=0.0.9",
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["bot", "api", "ai", "database", "services", "reports", "voice", "receipts", "exports", "utils"]
